[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "librus-synergia"
dynamic = ["version", "readme"]
description = "Unofficial async Python client for Librus Synergia (Polish school e-gradebook)"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michał Zaniewicz" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9", "yarl>=1.9", "tzdata"]
keywords = ["librus", "synergia", "e-dziennik", "school", "gradebook", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: Polish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
librus-synergia = "librus_synergia.cli:main"

[project.urls]
Homepage = "https://github.com/MichalZaniewicz/librus-synergia"
Documentation = "https://michalzaniewicz.github.io/librus-synergia/"
Issues = "https://github.com/MichalZaniewicz/librus-synergia/issues"
"Home Assistant integration" = "https://github.com/MichalZaniewicz/ha-librus-synergia"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "mypy"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[tool.hatch.version]
path = "src/librus_synergia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/librus_synergia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
strict = true
packages = ["librus_synergia"]
mypy_path = "src"

# PyPI's description is README.md with what pypi.org can't render swapped out:
# the GitHub-only video player becomes a clickable thumbnail, the [!TIP] alert
# marker goes, relative links become absolute.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '🔊 The player starts muted[^\n]*\n\n'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '> \[!TIP\]\n'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^https://github\.com/user-attachments/assets/[\w-]+$'
replacement = '[![Watch the librus-synergia video](https://raw.githubusercontent.com/MichalZaniewicz/librus-synergia/main/docs/demo-thumbnail.jpg)](https://github.com/MichalZaniewicz/librus-synergia#dont-want-to-read-watch-the-video)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/MichalZaniewicz/librus-synergia/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/MichalZaniewicz/librus-synergia/blob/main/\1"'
